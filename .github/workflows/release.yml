name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Stops the release when the tag and the version in the sources differ.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          npm=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$npm" ] || [ "$tag" != "$tauri" ] || [ "$tag" != "$cargo" ]; then
            echo "$GITHUB_REF_NAME does not match package.json ($npm), tauri.conf.json ($tauri) and Cargo.toml ($cargo)" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Waffle ${GITHUB_REF_NAME#v}" --generate-notes

  linux-packages:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config patchelf

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend first through beforeBuildCommand, and signs each
      # package for the updater.
      - name: Build the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ARCH=$(uname -m) NO_STRIP=true pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/deb/*.deb.sig \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/rpm/*.rpm.sig \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  windows-installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend first through beforeBuildCommand, and signs the
      # installer for the updater.
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  # Publishes latest.json, which installed copies read to find and verify an update.
  update-manifest:
    needs: [linux-packages, windows-installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          entry() {
            sig=$(ls sigs/*"$1".sig)
            jq -n --arg url "$base/$(basename "$sig" .sig)" --rawfile signature "$sig" \
              '{url: $url, signature: ($signature | rtrimstr("\n"))}'
          }
          jq -n --arg version "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%FT%TZ)" \
            --argjson appimage "$(entry .AppImage)" --argjson deb "$(entry .deb)" \
            --argjson rpm "$(entry .rpm)" --argjson nsis "$(entry -setup.exe)" \
            '{version: $version, pub_date: $date, platforms: {
              "linux-x86_64-appimage": $appimage,
              "linux-x86_64-deb": $deb,
              "linux-x86_64-rpm": $rpm,
              "windows-x86_64-nsis": $nsis
            }}' > latest.json
          gh release upload "$GITHUB_REF_NAME" --clobber latest.json
