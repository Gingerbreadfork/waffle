name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Stops the release when the tag and the version in the sources differ.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          npm=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$npm" ] || [ "$tag" != "$tauri" ] || [ "$tag" != "$cargo" ]; then
            echo "$GITHUB_REF_NAME does not match package.json ($npm), tauri.conf.json ($tauri) and Cargo.toml ($cargo)" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Waffle ${GITHUB_REF_NAME#v}" --generate-notes

  linux-packages:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config patchelf

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend first through beforeBuildCommand.
      - name: Build the packages
        run: ARCH=$(uname -m) NO_STRIP=true pnpm tauri build

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows-installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the frontend first through beforeBuildCommand.
      - name: Build the installer
        run: pnpm tauri build

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber src-tauri/target/release/bundle/nsis/*-setup.exe
